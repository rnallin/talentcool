packages:
  "recharts": "For rendering HR metrics and benchmarking charts"
  "@hello-pangea/dnd": "For the candidate pipeline Kanban board drag-and-drop"
  "date-fns": "For formatting dates in pt-BR locale"
  "@hookform/resolvers": "For form validation with Zod"
  "react-hook-form": "For building complex forms (create job, candidate)"
  "zod": "For form schema validation"

images:
  - path: "artifacts/hr-platform/public/images/logo-icon.png"
    description: "A minimal, modern geometric logo icon for an enterprise HR platform, abstract shape resembling a team or growth, deep indigo and vibrant blue colors, transparent background"
    aspect_ratio: "1:1"
  - path: "artifacts/hr-platform/public/images/empty-pipeline.png"
    description: "A beautiful, clean, abstract 3D illustration of an empty folder or inbox, soft lighting, professional enterprise style, indigo and white colors"
    aspect_ratio: "4:3"

notes:
  - "Assuming shadcn/ui components are pre-installed in src/components/ui/"
  - "Using @workspace/api-client-react for all API fetching as per monorepo rules"
  - "Using Tailwind CSS v4 syntax"
